image: docker:19.03.12

variables:
  WORKING_PATH: /var/www/sample-ci/sample-dotnetcore/
  DOCKER_SERVICE_NAME: webapp-core-3.1-img
  #CI_COMMIT_TAG: 6c125f87

services:
  - docker:19.03.12-dind

stages:
  - build
  - post-build
  - deploy

before_script:
  - docker info
  - echo $CURRENT_TAG
  - if echo "$CI_COMMIT_TAG" | grep -q "$CURRENT_TAG";
    then
    export DEPLOY_ENV=$CI_ENVIRONMENT_NAME;
    echo "Continue deploying";
    elif [ "$CI_COMMIT_BRANCH" == "master" ];
    then
    export DEPLOY_ENV=PROD;
    echo "Continue deploying";
    else
    echo "This job has tag is not used for current repository";
    exit 1;
    fi
  - eval $(ssh-agent -s)
  - echo "$SSH_KEY" | ssh-add -
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
  - export CI_REGISTRY_IMAGE=$DOCKER_REG_URL/$DOCKER_REPO/$DOCKER_SERVICE_NAME
  - export CI_REGISTRY_IMAGE_VERSION=${CI_COMMIT_SHA:0:8}
  - echo $CI_REGISTRY_IMAGE
  - if [ "$DOCKER_FILE_PATH" == "" ];
    then
    export DOCKER_FILE_PATH=".";
    else
    export DOCKER_FILE_PATH=$DOCKER_FILE_PATH;
    fi
  - echo $DOCKER_FILE_PATH
  - export CONFIG_FILE=$CONFIG_FILE_NAME.${DEPLOY_ENV}.$CONFIG_FILE_EXTENSION
  - if [ "$DOCKER_FILE_NAME" == "" ];
    then
    export DOCKER_FILE_NAME="Dockerfile";
    else
    export DOCKER_FILE_NAME=$DOCKER_FILE_NAME;
    fi
  - echo $DOCKER_FILE_NAME
  - if [ "$DOCKER_NETWORK_NAME" == "" ];
    then
    export DOCKER_NETWORK_NAME="bridge";
    else
    export DOCKER_NETWORK_NAME=$DOCKER_NETWORK_NAME;
    fi
  - echo $DOCKER_NETWORK_NAME


build_image:
  stage: build
  script:
    - echo $DOCKER_FILE_PATH
    - docker login -u $DOCKER_REG_USERNAME -p $DOCKER_REG_PASSWORD $DOCKER_REG_URL
    - docker pull $CI_REGISTRY_IMAGE:builder || true
    - docker build
      --target builder
      --cache-from $CI_REGISTRY_IMAGE:builder
      -f $DOCKER_FILE_PATH/$DOCKER_FILE_NAME
      --tag $CI_REGISTRY_IMAGE:builder
      --build-arg CACHEBUST=$(date +%s)
      --build-arg DEPLOY_ENV=$DEPLOY_ENV .
    - docker pull $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest || true
    - docker build
      --cache-from $CI_REGISTRY_IMAGE:builder
      --cache-from $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
      -f $DOCKER_FILE_PATH/$DOCKER_FILE_NAME
      --tag $CI_REGISTRY_IMAGE:$DEPLOY_ENV-$CI_REGISTRY_IMAGE_VERSION
      --build-arg CACHEBUST=$(date +%s)
      --build-arg DEPLOY_ENV=$DEPLOY_ENV .
    - docker push $CI_REGISTRY_IMAGE:$DEPLOY_ENV-$CI_REGISTRY_IMAGE_VERSION
    - docker tag $CI_REGISTRY_IMAGE:$DEPLOY_ENV-$CI_REGISTRY_IMAGE_VERSION $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
    - docker push $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
    - docker push $CI_REGISTRY_IMAGE:builder
  tags:
    - docker

post_build_local:
  stage: post-build
  needs: ['build_image']
  script:
    - echo "$DOCKER_REG_PASSWORD" | docker login -u "$DOCKER_REG_USERNAME" "$DOCKER_REG_URL" --password-stdin
    - docker pull $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION || true
    - docker tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
    - docker push $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
  tags:
    - docker
  environment:
    name: LOCAL

deploy_local:
  stage: deploy
  needs: ['post_build_local']
  variables:
    SERVER_IP: 10.10.50.14
    SERVER_USER: root
    SERVER_PORT: 22
    EXPOSE_PORT: 6969
    SWARM_REPLICAS: 2
    DOCKER_NETWORK_NAME: testing_net
  script:
    - export CONFIG_FILE=appsettings.${DEPLOY_ENV}.json
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p $WORKING_PATH"
    - scp ./configs/$CONFIG_FILE $SERVER_USER@$SERVER_IP:$WORKING_PATH
    - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP
      "(echo $DOCKER_REG_PASSWORD | docker login -u $DOCKER_REG_USERNAME $DOCKER_REG_URL --password-stdin)
      && docker pull $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
      && (docker rm -f $DOCKER_SERVICE_NAME-$DEPLOY_ENV || true)
      && docker service create
        --mode replicated
        --replicas $SWARM_REPLICAS
        --name $DOCKER_SERVICE_NAME-$DEPLOY_ENV
        --network $DOCKER_NETWORK_NAME
        --endpoint-mode dnsrr"
  tags:
    - docker
  environment:
    name: LOCAL