image: registry.nexdev.net:5050/docker/docker-engine/docker:19.03.14
#docker:19.03.12

variables:
  ####
  WORKING_PATH: /var/www/sample-ci/sample-dotnetcore/
  DOCKER_SERVICE_NAME: webapp-core
  DOCKER_REG_URL_Nexdev: registry.nexdev.net:5050
  DOCKER_REG_USERNAME_Nexdev: gitlab-ci
  DOCKER_REG_PASSWORD_Nexdev: 5j_3-pKrzGHbLGDUzBZN
  DOCKER_REPO: nexcel/nexops/demo
  DOCKER_IMAGE_NAME: aspnet-3.1
####
  CONFIG_FILE_NAME: appsettings
  CONFIG_FILE_EXTENSION: json
  CONFIGS_SRC_DIR_PATH: ./configs
  CONFIG_CONTAINER_PATH: /app/appsettings.json

stages:
  - build
  - post-build
  - deploy

before_script:
  - docker info
  - echo $CURRENT_TAG
  - if echo "$CI_COMMIT_TAG" | grep -q "$CURRENT_TAG";
    then
    export DEPLOY_ENV=$CI_ENVIRONMENT_NAME;
    echo "Continue deploying";
    elif [ "$CI_COMMIT_BRANCH" == "master" ];
    then
    export DEPLOY_ENV=PROD;
    echo "Continue deploying";
    else
    echo "This job has tag is not used for current repository";
    exit 1;
    fi
  - eval $(ssh-agent -s)
  - echo $SSH_KEY
  - echo "$SSH_KEY" | ssh-add -
  - mkdir -p ~/.ssh
  - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  - export COMMIT_MESSAGE=$(git log -1 --pretty=%B)
  - export CI_REGISTRY_IMAGE=$DOCKER_REG_URL_Nexdev/$DOCKER_REPO/$DOCKER_IMAGE_NAME
  - export CI_REGISTRY_IMAGE_VERSION=${CI_COMMIT_SHA:0:8}
  - echo $CI_REGISTRY_IMAGE
  - if [ "$DOCKER_FILE_PATH" == "" ];
    then
    export DOCKER_FILE_PATH=".";
    else
    export DOCKER_FILE_PATH=$DOCKER_FILE_PATH;
    fi
  - echo $DOCKER_FILE_PATH
  - export CONFIG_FILE=$CONFIG_FILE_NAME.${DEPLOY_ENV}.$CONFIG_FILE_EXTENSION
  - if [ "$DOCKER_FILE_NAME" == "" ];
    then
    export DOCKER_FILE_NAME="Dockerfile";
    else
    export DOCKER_FILE_NAME=$DOCKER_FILE_NAME;
    fi
  - echo $DOCKER_FILE_NAME
  - if [ "$DOCKER_NETWORK_NAME" == "" ];
    then
    export DOCKER_NETWORK_NAME="bridge";
    else
    export DOCKER_NETWORK_NAME=$DOCKER_NETWORK_NAME;
    fi
  - echo $DOCKER_NETWORK_NAME


build_image:
  stage: build
  script:
    - echo $DOCKER_FILE_PATH
    - docker login -u $DOCKER_REG_USERNAME_Nexdev -p $DOCKER_REG_PASSWORD_Nexdev $DOCKER_REG_URL_Nexdev
    - docker pull $CI_REGISTRY_IMAGE:builder || true
    - docker build
      --target builder
      --cache-from $CI_REGISTRY_IMAGE:builder
      -f $DOCKER_FILE_PATH/$DOCKER_FILE_NAME
      --tag $CI_REGISTRY_IMAGE:builder .
    - docker pull $CI_REGISTRY_IMAGE:latest || true
    - docker build
      --cache-from $CI_REGISTRY_IMAGE:builder
      --cache-from $CI_REGISTRY_IMAGE:latest
      -f $DOCKER_FILE_PATH/$DOCKER_FILE_NAME
      --tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION .
    - docker push $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION
    - docker tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:builder
  tags:
    - docker

post_build_local:
  stage: post-build
  needs: ['build_image']
  script:
    - echo "$DOCKER_REG_PASSWORD_Nexdev" | docker login -u "$DOCKER_REG_USERNAME_Nexdev" "$DOCKER_REG_URL_Nexdev" --password-stdin
    - docker pull $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION || true
    - docker tag $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
    - docker push $CI_REGISTRY_IMAGE:$DEPLOY_ENV-latest
  tags:
    - docker
  environment:
    name: LOCAL

deploy_local:
  stage: deploy
  needs: ['post_build_local']
  variables:
    #SERVER_IP: 10.70.70.33
    #SWARM_NODES: "10.70.70.32 10.70.70.33 10.70.70.34"
    #SERVER_USER: root
    #SERVER_PORT: 22
    #EXPOSE_PORT: 6969
    NODE_LABEL: "Demo-Service1"
    SWARM_REPLICAS: 3
    #DOCKER_NETWORK_NAME: testing_net

  script:
    - for NODE in $SWARM_NODES;
      do
        export NODE_PORT=$SERVER_PORT;
        echo $NODE:$NODE_PORT;
        ssh -o StrictHostKeyChecking=no -p $NODE_PORT $SERVER_USER@$NODE "mkdir -p $WORKING_PATH";
        echo "COPY CONFIG FILE LOCAL ...";
        scp $CONFIGS_SRC_DIR_PATH/$CONFIG_FILE $SERVER_USER@$NODE:$WORKING_PATH;
        echo "PULLING IMAGE ... ";
        ssh -o StrictHostKeyChecking=no -p $NODE_PORT $SERVER_USER@$NODE docker login -u $DOCKER_REG_USERNAME_Nexdev -p $DOCKER_REG_PASSWORD_Nexdev $DOCKER_REG_URL_Nexdev;
        ssh -o StrictHostKeyChecking=no -p $NODE_PORT $SERVER_USER@$NODE docker pull $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION;
      done
    - export CREATE_SERVICE_CMD="docker service create
        --mode replicated
        --replicas $SWARM_REPLICAS
        --name $DOCKER_SERVICE_NAME-$DEPLOY_ENV
        --network $DOCKER_NETWORK_NAME
        --endpoint-mode dnsrr
        --constraint node.labels.$NODE_LABEL==yes"
    - if [ ! -z "$CONFIG_FILE_NAME" ]; 
      then
        export CREATE_SERVICE_CMD="${CREATE_SERVICE_CMD} --mount type=bind,source=$WORKING_PATH/$CONFIG_FILE,target=$CONFIG_CONTAINER_PATH,ro=true";
      else
        echo "Not mount config file";
      fi
    - export CREATE_SERVICE_CMD="${CREATE_SERVICE_CMD} $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION"
    - echo $CREATE_SERVICE_CMD
    - ssh -o StrictHostKeyChecking=no -p $SERVER_PORT $SERVER_USER@$SERVER_IP
        "docker service ls | grep $DOCKER_SERVICE_NAME-$DEPLOY_ENV
        && echo "Updating service"
        && docker service update --image $CI_REGISTRY_IMAGE:$CI_REGISTRY_IMAGE_VERSION $DOCKER_SERVICE_NAME-$DEPLOY_ENV
        || (echo "Creating service" && $CREATE_SERVICE_CMD)"

  tags:
    - docker
  environment:
    name: LOCAL